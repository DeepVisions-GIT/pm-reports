<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>문화관람 PM 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 보고 목록: 종류별 묶음 → 날짜순 항목 */
:root {
  --bg: #f6f7fa; --surface: #ffffff; --ink: #1b2233; --muted: #5d667a; --line: #dfe3ec; --accent: #284887;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12151d; --surface: #1a1f2a; --ink: #e6e9f0; --muted: #9ba3b4; --line: #2c3342; --accent: #94aeea; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; }
h1 { margin: 0; font-size: 1.6rem; }
h2 { margin: 0; font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; }
.item { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.item:hover .t, .item:focus-visible .t { color: var(--accent); text-decoration: underline; }
.t { font-weight: 600; }
.d { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>문화관람 PM 보고</h1>
    <p class="muted">비전AI 기반 지능형 문화관람 서비스 시범 구축 사업의 보고 자료입니다.</p>
  </header>

  <section class="group" aria-labelledby="g-progress">
    <h2 id="g-progress">구현 현황</h2>
    <a class="item" href="progress/2026-10-29/"><span class="t">구현 현황 (AI 서비스 제외)</span><span class="d">2026-10-29</span></a>
  </section>
</div>
</body>
</html>
